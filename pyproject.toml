[project]
name = "gitpacman"
version = "0.1.0"
description = "A configurable Pac-Man game built with Pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mazegenerator",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = ["flake8>=7.0", "mypy>=1.0"]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.0.1-py3-none-any.whl" }

[[tool.mypy.overrides]]
module = "mazegenerator.*"
ignore_missing_imports = true
